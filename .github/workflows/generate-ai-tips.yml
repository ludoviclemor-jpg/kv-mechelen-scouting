name: Generate AI Scouting Tips

# Powers the "AI Scouting Tips" dashboard widget (docs/AI_TIPS.md).
# Static export + GitHub Pages has no backend that could safely call an
# LLM from the browser (the key would be exposed client-side) — same
# reasoning as every other sync workflow: a scheduled script does the
# real work with a service_role key and writes the result to Postgres,
# the frontend only ever reads it.
#
# Needs ANTHROPIC_API_KEY (secret, new), SUPABASE_SERVICE_ROLE_KEY
# (secret, existing) and NEXT_PUBLIC_SUPABASE_URL (variable, existing).

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily — after the other syncs
  workflow_dispatch: {}

concurrency:
  group: "ai-scouting-tips"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Generate tips
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-ai-tips.mjs
