name: Sync SofaScore

# Ratings enrichment sync (workflow/file names are a historical
# "SofaScore" label — the active provider is API-Football; see
# scripts/lib/apiFootballProvider.mjs, docs/SOFASCORE_PROVIDER.md).
#
# No-op until SOFASCORE_PROVIDER is set to "api-football" and
# API_FOOTBALL_KEY exists as a repository secret.
#
# Runs ONCE a day, deliberately — the free API-Football tier is capped at
# 100 requests/day, and the script's own per-run budget (default 90,
# API_FOOTBALL_MAX_REQUESTS_PER_RUN) assumes a single daily run. Running
# this more often would blow through the daily limit.

on:
  schedule:
    - cron: "15 4 * * *" # once daily, 04:15 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: "sofascore-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run ratings sync
        env:
          SOFASCORE_PROVIDER: ${{ vars.SOFASCORE_PROVIDER }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_BASE_URL: ${{ vars.API_FOOTBALL_BASE_URL }}
        run: node scripts/sync-sofascore.mjs

      - name: Commit updated player data (if anything changed)
        id: commit
        run: |
          git config user.name "sofascore-sync-bot"
          git config user.email "sofascore-sync-bot@users.noreply.github.com"
          git add data/players.json
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync ratings enrichment data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref ${{ github.ref_name }}
