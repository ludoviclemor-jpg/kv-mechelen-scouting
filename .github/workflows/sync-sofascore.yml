name: Sync SofaScore

# Ratings enrichment sync — currently dormant. No real ratings provider is
# connected (SofaScore's own API is confirmed blocked, 403, from every
# network tested; API-Football was implemented but explicitly removed per
# instruction — never connected to a real key, so nothing regresses by
# removing it; FotMob was investigated and ruled out for the same class
# of anti-bot bypass requirement). See docs/SOFASCORE_PROVIDER.md.
#
# scripts/lib/sofascoreProvider.mjs always returns the null provider
# today, so running this script does nothing harmful — but it also still
# targets the old data/players.json file, not the real Postgres `players`
# table (see docs/SCOUTASTIC_SYNC.md for that migration, already done for
# the player sync itself) — so it wouldn't do anything *useful* yet
# either, even with a real provider connected. Scheduled runs are
# disabled until both of those are addressed; kept as workflow_dispatch
# only so it's easy to smoke-test once work resumes here.

on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run ratings sync (no-op — no real provider connected)
        run: node scripts/sync-sofascore.mjs
