name: Sync SCOUTASTIC

# Batched, resumable player-squad crawl (competitions -> teams -> squads,
# see docs/SCOUTASTIC_SYNC.md) — writes straight to Postgres via the
# service_role key. No git commit, no Pages deploy trigger: player data
# lives only in Postgres now, read by the frontend at runtime, same as
# the Competitions feature (docs/COMPETITIONS.md).
#
# Needs SCOUTASTIC_API_KEY, SUPABASE_SERVICE_ROLE_KEY (both secrets) and
# NEXT_PUBLIC_SUPABASE_URL (an existing repository variable). None of
# these are ever printed, logged, or written to any file.
#
# Run scripts/sync-competitions.mjs (its own workflow) at least once
# before this one — the competition/team catalog it builds is what this
# crawl's queue and league-context lookups depend on.

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily — one batch per day; see batch-size below
  workflow_dispatch:
    inputs:
      batch_size:
        description: "How many teams to crawl this run"
        required: false
        default: "500"

concurrency:
  group: "scoutastic-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run SCOUTASTIC player sync
        env:
          SCOUTASTIC_API_KEY: ${{ secrets.SCOUTASTIC_API_KEY }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-scoutastic.mjs --batch-size ${{ github.event.inputs.batch_size || '500' }}
